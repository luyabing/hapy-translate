name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述使用场景，而不只是功能名称
      placeholder: 我在 ... 时，需要 ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue 和 README
          required: true
